name: selftest

# The toolkit has no dependencies and ships no ROMs, so this is the whole check:
# the self-test (which includes the Lua probe lint, the doc-reference checks and
# a flake8 pass for real errors). Checks that need a cartridge, MAME or a
# Windows machine are skipped here -- see the README's note on what CI cannot
# verify.

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install flake8
      - run: python tools/selftest.py

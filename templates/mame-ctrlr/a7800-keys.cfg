<?xml version="1.0"?>
<!--
  Keys for recording a 7800 session in a window (tools/session.py passes
  -ctrlrpath templates/mame-ctrlr -ctrlr a7800-keys on Windows).

  MAME's default for the joystick's button 2 is Left Alt. In a window on
  Windows, a lone tap of Left Alt opens the window's menu, and the keys go
  there instead of to MAME until the next tap: the button seems to lock up,
  and the recording simply has no presses for that stretch (a recording holds
  only what MAME received). Here button 2 is Space or Left Shift. Button 1
  stays Left Ctrl.

  A recording stores the buttons, not the keys, so recordings made either way
  play back the same.
-->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_BUTTON2">
                <newseq type="standard">KEYCODE_SPACE OR KEYCODE_LSHIFT</newseq>
            </port>
        </input>
    </system>
</mameconfig>
